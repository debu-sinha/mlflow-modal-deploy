[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-modal-deploy"
version = "0.6.2"
description = "MLflow deployment plugin for Modal serverless GPU infrastructure (actively maintained)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Debu Sinha"}
]
keywords = ["mlflow", "modal", "deployment", "serverless", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlflow>=2.10.0",
    "modal>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "twine>=4.0.0",
    "build>=1.0.0",
    "mypy>=1.10.0",
    "types-requests>=2.28.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/debu-sinha/mlflow-modal-deploy"
Repository = "https://github.com/debu-sinha/mlflow-modal-deploy"
Issues = "https://github.com/debu-sinha/mlflow-modal-deploy/issues"
Changelog = "https://github.com/debu-sinha/mlflow-modal-deploy/blob/main/CHANGELOG.md"

[project.entry-points."mlflow.deployments"]
modal = "mlflow_modal.deployment"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM", "PIE", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "modal.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["mlflow_modal"]
branch = true

[tool.coverage.report]
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.codespell]
skip = ".git,*.lock,dist,build,.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
